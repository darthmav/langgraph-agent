[project]
name = "langgraph-agent"
version = "0.2.0"
description = "3-Agent AI System: Planner, Researcher, Builder"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",    # optional cloud provider
    "langchain-anthropic>=0.2.0",  # primary cloud provider
    "mcp>=0.5.0",
    "python-dotenv>=1.0.0",
    # GraphRAG dependencies
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "networkx>=3.0",
    "faiss-cpu>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.5.0",
    "mypy>=1.10",
    "langsmith>=0.1.0",
]
